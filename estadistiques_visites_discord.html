<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadístiques de visites</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 650px; margin: 10vh auto; padding: 0 1rem; color: #202124; }
    main { border: 1px solid #ddd; border-radius: 14px; padding: 1.5rem; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Estadístiques de visites</h1>
    <p>Aquesta pàgina consulta automàticament la teva IP pública i l'envia al webhook de Discord del responsable per a estadístiques de visites.</p>
    <p id="status" role="status" aria-live="polite">Enviant les estadístiques…</p>
  </main>

  <script>
    // Configura aquí el webhook. Aquest URL quedarà visible al codi font;
    // per a un lloc públic, és més segur enviar les dades des d'un servidor propi.
    const DISCORD_WEBHOOK_URL = "ENGANXA_AQUI_L_URL_DEL_WEBHOOK";

    async function sendVisitStats() {
      const status = document.getElementById("status");
      try {
        if (!DISCORD_WEBHOOK_URL.startsWith("https://discord.com/api/webhooks/") &&
            !DISCORD_WEBHOOK_URL.startsWith("https://discordapp.com/api/webhooks/")) {
          throw new Error("Configura DISCORD_WEBHOOK_URL al codi HTML.");
        }

        const response = await fetch("https://api.ipify.org?format=json");
        if (!response.ok) throw new Error("No s'ha pogut consultar la IP pública.");
        const { ip } = await response.json();

        const sent = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: `Visita nova — IP pública: ${ip}`
          })
        });

        if (!sent.ok) {
          throw new Error("No s'ha pogut enviar al webhook. El navegador pot bloquejar la petició per CORS; caldria un servidor intermediari.");
        }
        status.textContent = "Estadístiques enviades.";
      } catch (error) {
        status.textContent = `No s'han pogut enviar les estadístiques: ${error.message}`;
      }
    }

    // S'executa automàticament en carregar la pàgina.
    window.addEventListener("DOMContentLoaded", sendVisitStats);
  </script>
</body>
</html>
